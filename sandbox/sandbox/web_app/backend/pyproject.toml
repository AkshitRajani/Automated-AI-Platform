[project]
name = "sandbox-web-backend"
version = "0.1.0"
description = "FastAPI bridge from web UI to the V4 sandbox core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "python-multipart>=0.0.18",
    "behave>=1.2.6",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
