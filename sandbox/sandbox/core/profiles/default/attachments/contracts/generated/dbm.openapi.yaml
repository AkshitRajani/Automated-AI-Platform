openapi: 3.0.3
info:
  title: DBM (Data Backbone Manager)
  description: |
    Resolves a logical dataset name + scenario coordinate to physical storage
    coordinates (S3 path, Glue catalog table) in the tenant's data lake.
    THIS IS A STUB. Real OpenAPI pending from tenant.
  version: stub-1.0
servers:
  - url: http://microcks:8080/dbm
    description: Sandbox Microcks mock
  - url: https://dbm.api-devl.intg.example.com/dbm
    description: tenant real (devl) — production will be different host
paths:
  /query:
    get:
      summary: Resolve a logical dataset name to physical coordinates
      description: |
        Given a logical dataset name (e.g. "CCFA_CashFlow_TV", "LN_INTRM_TM_SERS_DATA_PREP_SPST")
        and a scenario coordinate (scenario_id OR jumpoff_date), return the S3
        path and Glue catalog reference where that dataset's parquet lives.
      parameters:
        - name: name
          in: query
          required: true
          description: Logical dataset name from the catalog (e.g. CCFA_CashFlow_TV).
          schema: { type: string }
          examples:
            ccfa_tv:
              value: CCFA_CashFlow_TV
            input_table:
              value: LN_INTRM_TM_SERS_DATA_PREP_SPST
        - name: scenario_id
          in: query
          required: false
          description: |
            Scenario identifier. Required when looking up scenario-bound datasets.
            Mutually optional with jumpoff: at least one must be provided.
          schema: { type: string }
          example: "202401_ADHOC_EXE_PREP_446_20241114215238_610075083"
        - name: jumpoff
          in: query
          required: false
          description: |
            Jumpoff date (YYYY-MM-DD or YYYYMMDD). Used when looking up
            time-bound non-scenario datasets (per CCFA_loan_list_extract example).
          schema: { type: string }
          example: "2024-12-31"
        - name: alternate_lookup_id
          in: query
          required: false
          description: Alternate lookup key (seen in CCFA_Loan_List context).
          schema: { type: string }
      responses:
        '200':
          description: Coordinates resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinatesResponse'
              examples:
                ccfa_tv_resolution:
                  summary: CCFA cash-flow TV dataset for a scenario
                  value:
                    s3_bucket: etl_workflow-devl-fcdl-pp80-staging
                    s3_prefix: cashflow/CCFA_CashFlow_TV/scenario_id=202401_ADHOC_EXE_PREP_446_20241114215238_610075083/
                    glue_database_name: aap_sandbox_devl
                    glue_table_name: ccfa_cashflow_tv
                    format: parquet
                    compression: snappy
                input_table_resolution:
                  summary: MBS4Plus input table for scenario
                  value:
                    s3_bucket: etl_workflow-devl-fcdl-pp80-staging
                    s3_prefix: input/LN_INTRM_TM_SERS_DATA_PREP_SPST/
                    glue_database_name: aap_sandbox_devl
                    glue_table_name: ln_intrm_tm_sers_data_prep_spst
                    format: parquet
                    compression: snappy
        '404':
          description: Dataset name not found in catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '400':
          description: Missing required parameters (need scenario_id or jumpoff).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    CoordinatesResponse:
      type: object
      description: |
        Physical coordinates for a logical dataset.
        Field names confirmed against mb4.yml: ${X.s3_bucket}, ${X.s3_prefix},
        ${X.glue_database_name}, ${X.glue_table_name}, ${X.format},
        ${X.compression} all appear as parameter substitutions.
      required: [s3_bucket, s3_prefix, glue_database_name, glue_table_name]
      properties:
        s3_bucket:        { type: string, example: "etl_workflow-devl-fcdl-pp80-staging" }
        s3_prefix:        { type: string, example: "input/LN_INTRM_TM_SERS_DATA_PREP_SPST/" }
        glue_database_name:
          type: string
          example: "aap_sandbox_devl"
        glue_table_name:
          type: string
          example: "ln_intrm_tm_sers_data_prep_spst"
        format:           { type: string, enum: [parquet, csv, orc], default: parquet }
        compression:      { type: string, enum: [snappy, gzip, none], default: snappy }
        primary_partition_keys:
          type: array
          items: { type: string }
          example: ["bch_obj_id", "fncl_frct_snro_id"]
        secondary_partition_keys:
          type: array
          items: { type: string }
          default: []
    Error:
      type: object
      required: [error]
      properties:
        error:   { type: string }
        details: { type: string }
