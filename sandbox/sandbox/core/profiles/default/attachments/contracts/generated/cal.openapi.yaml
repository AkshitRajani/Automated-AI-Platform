openapi: 3.0.3
info:
  title: CAL (Calculation Service)
  description: |
    Asynchronous calculation submission and polling. Caller submits a scenario
    payload, gets back an execution_id, polls status until SUCCEEDED/FAILED.
    THIS IS A STUB. Real OpenAPI pending from tenant.
    NOTE: real polling cadence is 10+ minutes; sandbox mock flips at 2 seconds
    (Microcks dispatcher TTL) so tests don't take an hour to run.
  version: stub-1.0
servers:
  - url: http://microcks:8080/cal
    description: Sandbox Microcks mock
  - url: https://cal.api-devlint.intg.example.com/cal
    description: tenant real (devlint) — production will be different host

paths:
  /calculation2/execute:
    post:
      summary: Submit a calculation
      description: |
        Submit a scenario for asynchronous calculation. Returns 202 with
        execution_id. Client must poll /calculation2/status until SUCCEEDED or FAILED.
      requestBody:
        required: true
        content:
          application/vnd.iaas.v1+json:
            schema: { $ref: '#/components/schemas/SubmissionData' }
            example:
              forecast_date: "202312"
              scenario_id: "202401_ADHOC_EXE_PREP_446_20241114215238_610075083"
              hpfa_path: "s3://heraaws-devl-cmdl-us-east-1/insight/crs/dflt/DSET00010127/202312/Base/DF0/shift_only/MthlyTimeSeries/Hist_202312/"
              interestRateMarketDate_last_business_day: "2023-12-29"
              stress_toggle: "False"
              Econ_cfg_Interest_Rates_VNML: "s3://aap_sandbox-devl-fcdl-us-east-1/insight/cin/dflt/DSET00030758/ECON_CFG/Interest_Rates/VNML/V1/CF_Econ_No_Shock.xml"
              Econ_cfg_Interest_Rates_proscribed_rate_file: null
      responses:
        '202':
          description: Accepted; calculation queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAck' }
              example:
                execution_id: "202401_ADHOC_EXE_PREP_446_20241114215238_610075083"
                state: SUBMITTED
                submitted_at: "2026-04-30T14:00:00Z"
        '400':
          description: Malformed submission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /calculation2/status:
    get:
      summary: Poll calculation status
      description: |
        Returns current state. Real cadence is 10+ minutes; sandbox flips
        RUNNING → SUCCEEDED at TTL=2s (Microcks dispatcher).
      parameters:
        - name: execution_id
          in: query
          required: true
          description: |
            The execution_id returned by /execute. NOTE: in current tenant env
            flow, scenario_id is used as the execution_id (see payload.txt
            status_data shape).
          schema: { type: string }
          example: "202401_ADHOC_EXE_PREP_446_20241114215238_610075083"
      responses:
        '200':
          description: Status response (any state).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
              examples:
                running:
                  summary: Still running
                  value:
                    execution_id: "202401_ADHOC_EXE_PREP_446_20241114215238_610075083"
                    state: RUNNING
                    progress_percent: 42
                succeeded:
                  summary: Done with result
                  value:
                    execution_id: "202401_ADHOC_EXE_PREP_446_20241114215238_610075083"
                    state: SUCCEEDED
                    result_s3_path: "s3://etl_workflow-devl-fcdl-pp80-staging/output/MBS4PLUS/scenario_id=202401_ADHOC_EXE_PREP_446_20241114215238_610075083/LN_TM_SERS_MBS4PLUS.parquet"
                    completed_at: "2026-04-30T14:00:02Z"
                failed:
                  summary: Failed with reason
                  value:
                    execution_id: "202401_ADHOC_EXE_PREP_446_20241114215238_610075083"
                    state: FAILED
                    error_code: "CAL_TIMEOUT"
                    error_detail: "Calculation exceeded max runtime"
        '404':
          description: execution_id not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    SubmissionData:
      type: object
      description: |
        Field names taken directly from payload.txt's submission_data block.
        These fields appear repeatedly across multiple Step Function payloads,
        so we have high confidence in the names.
      required: [scenario_id, forecast_date]
      properties:
        forecast_date: { type: string, example: "202312" }
        scenario_id:   { type: string, example: "202401_ADHOC_EXE_PREP_446_20241114215238_610075083" }
        hpfa_path:     { type: string, format: uri }
        interestRateMarketDate_last_business_day:
          type: string
          format: date
        stress_toggle:                                { type: string, enum: ["True", "False"] }
        Econ_cfg_Interest_Rates_VNML:                 { type: [string, "null"] }
        Econ_cfg_Interest_Rates_proscribed_rate_file: { type: [string, "null"] }
    SubmissionAck:
      type: object
      required: [execution_id, state]
      properties:
        execution_id: { type: string }
        state:        { type: string, enum: [SUBMITTED] }
        submitted_at: { type: string, format: date-time }
    StatusResponse:
      type: object
      required: [execution_id, state]
      properties:
        execution_id:    { type: string }
        state:           { type: string, enum: [SUBMITTED, RUNNING, SUCCEEDED, FAILED] }
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Optional progress hint while RUNNING.
        result_s3_path:  { type: string, format: uri, description: "Present iff state=SUCCEEDED" }
        completed_at:    { type: string, format: date-time, description: "Present iff state in {SUCCEEDED, FAILED}" }
        error_code:      { type: string, description: "Present iff state=FAILED" }
        error_detail:    { type: string, description: "Present iff state=FAILED" }
    Error:
      type: object
      required: [error]
      properties:
        error:   { type: string }
        details: { type: string }
