# -----------------------------------------------------------------------------
# column_dictionary — REAL (107 rows in MB42.csv)
# -----------------------------------------------------------------------------
# Source: <source>/MB42.csv
# 107 rows, header: Field Name,Data Type,Business Meaning,...,Sample Value,Field Description/Comments
# Note: MB42 schema differs from spec.schema.json column_dictionary_row schema.
# Constructor will need a one-time CSV transformation step (see TODO in COVERAGE.md).
column_dictionary:
  snapshot_date: "2026-04-30"
  tables:
    - table_name: LN_INTRM_TM_SERS_DATA_PREP_SPST
      # REAL — input table, 107 columns confirmed via pyarrow.read_schema(all_loans.parquet)
      # MB42.csv (107 rows) is the column dictionary for THIS table.
      source_system: AAP_SANDBOX
      delivered_in: "2025-extracted-from-bdd-test-agent"
      snapshot_parquet_path: attachments/parquets/all_loans.parquet
      partition_keys:
        # REAL — confirmed lowercase in parquet schema (last 3 fields are lower_snake)
        - bch_obj_id
        - fncl_frct_snro_id
      columns_csv_path: MB42.csv   # REAL — drop-in from 2025/
      columns_csv_sha256: "PLACEHOLDER_COMPUTE_AT_INGEST"        # SYNTHESIZED at constructor time
      approximate_column_count: 107

    - table_name: LN_TM_SERS_MBS4PLUS
      # REAL — output table, 28 columns confirmed via pyarrow.read_schema(LN_TM_SERS_MBS4PLUS.parquet)
      # No external column dict; SYNTHESIZED from parquet schema directly.
      source_system: MBS4Plus
      delivered_in: "2025-derived-from-glue-output"
      snapshot_parquet_path: attachments/parquets/LN_TM_SERS_MBS4PLUS.parquet
      partition_keys:
        # STUB — mb4.yml writes by scenario_id + bch_obj_id; confirm with the tenant
        - bch_obj_id
        - fncl_frct_snro_id
      columns_csv_path: LN_TM_SERS_MBS4PLUS.columns.csv   # SYNTHESIZED from parquet schema
      columns_csv_sha256: "PLACEHOLDER_COMPUTE_AT_INGEST"
      approximate_column_count: 28

  framework_reserved:
    # REAL — from spec.template.json and 04_sandbox.md design
    - BUS_RPTG_PRD_MTH_NO
    - REC_CREN_DTTM
    - REC_CREN_USR_ID

  casing_exceptions:
    # REAL — confirmed against mb4.yml (these columns appear lowercase in SQL)
    - column_name: bch_obj_id
      actual_casing: lower_snake
      reason: "cast_in_pipeline=false; legacy upstream casing preserved (mb4.yml line: bch_obj_id = '${LN_INTRM_TM_SERS_DATA_PREP_SPST.bch_obj_id}')"
    - column_name: fncl_frct_snro_id
      actual_casing: lower_snake
      reason: "cast_in_pipeline=false; partition key, legacy casing"
    - column_name: ln_acvy_rptg_prd_dt
      actual_casing: lower_snake
      reason: "cast_in_pipeline=false (mb4.yml uses lowercase form throughout)"
    - column_name: ln_dlq_mths_cnt
      actual_casing: lower_snake
      reason: "cast_in_pipeline=false; appears as both lower (assignment) and UPPER (CHANGE_SOURCE_3519) forms"

  global_aliases:
    # STUB — only one in spec.template; expand as Coding Agent learns
    - alias: "UPB Field"
      resolves_to: "LN_TM_SERS_MBS4PLUS.LN_DFLT_UPB_AMT"
    - alias: "delinquency months"
      resolves_to: "LN_TM_SERS_MBS4PLUS.ln_dlq_mths_cnt"
    - alias: "scenario id"
      resolves_to: "LN_TM_SERS_MBS4PLUS.fncl_frct_snro_id"

