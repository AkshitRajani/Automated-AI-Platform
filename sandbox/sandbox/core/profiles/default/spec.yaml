data_flows:
  - id: ccfa_main_flow
    description: "CCFA scenario submission → Lock → Glue ETL → DBM lookup → CAL async calc → S3 output"
    edges:
      - from: { kind: lambda, name: hlx-aap_sandbox-controller-lambda }
        to:   { kind: lambda, name: hlx-aap_sandbox-generic-lock-handler-lambda }
        via:  lambda_invoke
      - from: { kind: lambda, name: hlx-aap_sandbox-generic-lock-handler-lambda }
        to:   { kind: dynamodb, name: aap_sandbox-dynamo-api-submission-status-table }
        via:  put_item
      - from: { kind: lambda, name: hlx-aap_sandbox-klc-payload-generator }
        to:   { kind: glue_job, name: mbs4plus_extract_transform }
        via:  glue_run
      - from: { kind: glue_job, name: mbs4plus_extract_transform }
        to:   { kind: s3, name: etl_workflow-devl-fcdl-pp80-staging, prefix: "output/MBS4PLUS/" }
        via:  put_object
      - from: { kind: lambda, name: hlx-aap_sandbox-klc-status-handler }
        to:   { kind: dynamodb, name: aap_sandbox-dynamo-api-submission-status-table }
        via:  update_item

# -----------------------------------------------------------------------------
# control_flows — SYNTHESIZED from Step Function names + lambda integrations
# -----------------------------------------------------------------------------
control_flows:
  - id: api_submission_workflow
    workflow_name: "API Submission Workflow"
    step_function_ref: aap_sandbox-generic-api-submission-workflow
    sequence:
      - node: AcquireSlot
        action: "Reserve concurrency slot in DynamoDB"
        waits_for: []
        is_async: false
        max_dwell_seconds: 5
      - node: GeneratePayload
        action: "KLC payload generator builds CAL request from scenario inputs"
        waits_for: [AcquireSlot]
        is_async: false
        max_dwell_seconds: 30
      - node: SubmitToCAL
        action: "POST /calculation2/execute → returns 202 with execution_id"
        waits_for: [GeneratePayload]
        is_async: true
        max_dwell_seconds: 10
      - node: PollCALStatus
        action: "GET /calculation2/status?execution_id=X until SUCCEEDED or max polls"
        waits_for: [SubmitToCAL]
        is_async: true
        max_dwell_seconds: 198000   # ~55 hours real; mocked to 2s in sandbox
      - node: HandleResponse
        action: "Persist CAL result to S3 + update DynamoDB status"
        waits_for: [PollCALStatus]
        is_async: false
        max_dwell_seconds: 30
      - node: ReleaseSlot
        action: "Free concurrency slot"
        waits_for: [HandleResponse]
        is_async: false
        max_dwell_seconds: 5
    error_paths:
      - node: PollCALStatus
        failure_type: max_polls_exceeded
        handling: "Mark scenario FAILED in DynamoDB; release slot; emit alarm"
        retryable: false
      - node: SubmitToCAL
        failure_type: timeout
        handling: "Retry up to 3x with exponential backoff; if still fails, FAILED"
        retryable: true

# -----------------------------------------------------------------------------
# column_lineage — REAL extractable from mb4.yml CASE/SELECT statements
# -----------------------------------------------------------------------------
# Two examples below; full lineage SYNTHESIZED at constructor time by parsing
# mb4.yml SQL fragments. ~50 output columns; doing 2 here as proof-of-shape.
column_lineage:
  - glue_job_ref: mbs4plus_extract_transform
    output_dataset: LN_TM_SERS_MBS4PLUS
    transformations:
      - output_column: ln_dlq_mths_cnt_1
        input_columns: [ln_acvy_rptg_prd_dt, ln_dlq_mths_cnt]
        expression_sql_or_prose: |
          CASE WHEN ln_acvy_rptg_prd_dt = '${jumpoff_full_date}' THEN NULL
               ELSE COALESCE(ln_dlq_mths_cnt, 9999) END
        rule_ref: null
      - output_column: rdm_less_rtf_rate
        input_columns: [rdm, rtf_rt, ln_acvy_rptg_prd_dt]
        expression_sql_or_prose: |
          CASE WHEN rdm < rtf_rt
               AND CAST(ln_acvy_rptg_prd_dt as DATE) > CAST('${jumpoff_full_date}' as DATE)
               THEN 1 ELSE 0 END
        rule_ref: null
      - output_column: CHANGE_SOURCE_3519_flag
        input_columns: [LN_FRCT_SCZN_STAT_TYP, LN_DLQ_MTHS_CNT, LN_MDFC_PGM_TYP]
        expression_sql_or_prose: |
          UPPER(LN_FRCT_SCZN_STAT_TYP) IN ('TRUST')
          AND LN_DLQ_MTHS_CNT >= '${Loan Past Due Threshold (repurch_num_months)}'
          AND COALESCE(LN_MDFC_PGM_TYP, '') != 'RPP'
        rule_ref: CHANGE_SOURCE_3519

# -----------------------------------------------------------------------------
# behavioral_contracts — STUB OpenAPIs from sample.txt and payload.txt
# -----------------------------------------------------------------------------
# DBM and CAL real OpenAPIs are TAGGED-GAP (P0.2, P0.3 in ask_f).
# Behavior models below derived from V1 construction_guide.md §7 + payload samples.
behavioral_contracts:
  - name: dbm
    consumer: hlx-aap_sandbox-service-backbone-manager-lambda
    provider: dbm
    interaction_type: http_sync
    request_contract_summary: "GET /dbm/query?capability=X&scenario_id=Y → returns dataset coordinates (S3 path, glue table, partitions)"
    state_machine:
      states:
        - name: ready
          transitions: []
          dwell_seconds_p50: 0
          terminal: true
    response_per_state:
      ready: { status: 200, body_template: "from sample.txt 760B response (REAL sample)" }

  - name: cal
    consumer: hlx-aap_sandbox-klc-status-handler
    provider: cal
    interaction_type: http_async_polling
    request_contract_summary: "POST /calculation2/execute (start) → 202 + execution_id; GET /calculation2/status?execution_id=X until SUCCEEDED"
    state_machine:
      states:
        - name: SUBMITTED
          transitions: [RUNNING]
          dwell_seconds_p50: 0
          max_dwell_seconds: 0
          terminal: false
        - name: RUNNING
          transitions: [SUCCEEDED, FAILED]
          dwell_seconds_p50: 2          # STUB — mocked; real is up to 55 hours
          max_dwell_seconds: 198000
          terminal: false
        - name: SUCCEEDED
          transitions: []
          terminal: true
        - name: FAILED
          transitions: []
          terminal: true
    response_per_state:
      SUBMITTED: { status: 202, body: { execution_id: "${stepName}" } }
      RUNNING:   { status: 200, body: { state: "RUNNING" } }
      SUCCEEDED: { status: 200, body: { state: "SUCCEEDED", result_s3_path: "s3://etl_workflow-devl-fcdl-pp80-staging/output/MBS4PLUS/LN_TM_SERS_MBS4PLUS.parquet" } }
      FAILED:    { status: 200, body: { state: "FAILED", error: "STUB" } }

# -----------------------------------------------------------------------------
# parameters — REAL tokens extracted from mb4.yml
# -----------------------------------------------------------------------------
parameters:
  - token: "${jumpoff_full_date}"
    source: dbm
    data_type: DATE
    format_hint: "YYYY-MM-DD"
    default_value: null
    valid_min: "2010-01-01"
    valid_max: "2099-12-31"
    found_in:
      - "attachments/pipelines/mb4.yml"

  - token: "${Loan Past Due Threshold (repurch_num_months)}"
    source: dbm
    data_type: INTEGER
    format_hint: "months"
    default_value: 24
    valid_min: 1
    valid_max: 240
    found_in:
      - "attachments/pipelines/mb4.yml"

  - token: "${scenario_id}"
    source: operator_ui
    data_type: STRING
    format_hint: "{YYYYMM}_{ADHOC|REGULAR}_{TYPE}_{N}_{TIMESTAMP}_{RANDOM}"
    default_value: null
    found_in:
      - "attachments/pipelines/mb4.yml"
      - "Lambda env at runtime"

  - token: "${CAPITAL_MARKETS.MBS_Repurchase.RTF_Backfill_for_Defaults.implicit}"
    source: dbm
    data_type: STRING
    format_hint: "DBM grid lookup key"
    default_value: null
    found_in: ["attachments/pipelines/mb4.yml"]

  - token: "${CAPITAL_MARKETS.MBS_Repurchase.RTF_Rate.implicit}"
    source: dbm
    data_type: STRING
    format_hint: "DBM grid lookup key"
    default_value: null
    found_in: ["attachments/pipelines/mb4.yml"]

# -----------------------------------------------------------------------------
# business_rules — REAL names, prose from findings/05_domain_knowledge.md
# -----------------------------------------------------------------------------
# Authoritative SQL is TAGGED-GAP (P0.4 in ask_f). Until ships, draft SQL lives
# in attachments/rules/draft/*.sql with signoff_status='inferred'.
business_rules:
  - rule_name: CHANGE_SOURCE_2616
    prose: "Portfolio loans reclassification at jumpoff. Loans with LN_FRCT_SCZN_STAT_TYP='PORTFOLIO' and reclassification fields populated as of jumpoff are flagged for downstream default treatment."
    sql_path: CHANGE_SOURCE_2616.sql
    precedence_note: "Evaluated before CHANGE_SOURCE_3515 (default backfill); a loan can be CS_2616-flagged AND CS_3515-flagged, in which case 3515's MIN_RCLSN_DT logic applies."
    edge_cases_path: null

  - rule_name: CHANGE_SOURCE_3519
    prose: "Trust loans, delinquent past the configured past-due threshold, and not under RPP modification. Implements: UPPER(LN_FRCT_SCZN_STAT_TYP) IN ('TRUST') AND LN_DLQ_MTHS_CNT >= ${Loan Past Due Threshold} AND COALESCE(LN_MDFC_PGM_TYP,'') != 'RPP'"
    sql_path: CHANGE_SOURCE_3519.sql
    precedence_note: "Mutually exclusive with CHANGE_SOURCE_2908 (FLEXMOD success); a loan cannot be both."

  - rule_name: CHANGE_SOURCE_2908
    prose: "FLEXMOD modification success path. Loans whose modification program completed successfully and meet the FLEXMOD criteria."
    sql_path: CHANGE_SOURCE_2908.sql
    precedence_note: "Excludes loans flagged under CHANGE_SOURCE_3519."

  - rule_name: CHANGE_SOURCE_3067
    prose: "Trust loan random-sampling repurchase. Subset of trust loans selected via deterministic random sampling for repurchase backfill scenarios."
    sql_path: CHANGE_SOURCE_3067.sql
    precedence_note: "Sampling occurs after CHANGE_SOURCE_3519 evaluation; sampled loans inherit 3519's date treatment."

  - rule_name: CHANGE_SOURCE_3515
    prose: "Default status backfill. Sets MIN_RCLSN_DT_3515 = GREATEST(jumpoff+1month, ADD_MONTHS(MIN_RCLSN_DT_3515_tmp, RTF_Backfill_Months_for_Defaults * -1)) when CHANGE_SOURCE_3515='Y'."
    sql_path: CHANGE_SOURCE_3515.sql
    precedence_note: "Applied last; dominates CS_2616 in date-arithmetic resolution."

