# Local Automated AI Platform infrastructure (KB Postgres). Sandbox stack is started separately
# from sandbox/sandbox/core (LocalStack + Microcks + app Postgres on 5433).
services:
  kb-postgres:
    image: pgvector/pgvector:pg16
    container_name: aap_kb_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - aap_kb_pgdata:/var/lib/postgresql/data
      - ./ingestion/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: aap_neo4j
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol (the driver connects here)
    environment:
      NEO4J_AUTH: neo4j/localgraphpw
      NEO4J_PLUGINS: '[]'
    volumes:
      - aap_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aap_kb_pgdata:
  aap_neo4j_data:
